[workspace]
resolver = "2"
members = ["crates/solitaire-core", "crates/solitaire-render", "crates/solitaire-kindle", "crates/solitaire-desktop"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
solitaire-core = { path = "crates/solitaire-core" }
solitaire-render = { path = "crates/solitaire-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
