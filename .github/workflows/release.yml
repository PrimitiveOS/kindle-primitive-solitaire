name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    uses: DoanNguyenTrong/kindle-primitive-build/.github/workflows/package.yml@v1
    with:
      id: primitive-solitaire
      dir: solitaire
      binary-crate: solitaire-kindle
      docs-licence-file: LICENSE-DOCS
      sibling-tools-ref: main
